services:
  app:
    build: .
    ports: ["8088:8000"]
    environment: {APP_ENV: local, APP_DEBUG: "true", APP_KEY: "base64:hWZl6srxQJTK8DlLt6/zRw6/OdcFV9vLFcdkzCcJahw=", DB_CONNECTION: mysql, DB_HOST: mysql, DB_DATABASE: billing, DB_USERNAME: root, DB_PASSWORD: root, SESSION_DRIVER: file, CACHE_STORE: file}
    depends_on:
      mysql: {condition: service_healthy}
    volumes: [".:/var/www/html", "/var/www/html/vendor"]
  mysql:
    image: mysql:8.0
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: billing}
    ports: ["3308:3306"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"], interval: 5s, timeout: 5s, retries: 20}
    volumes: ["bad_mysql:/var/lib/mysql"]
volumes: {bad_mysql: {}}
