# `analyzer/` é a raiz de import do pipeline.
#
# O código veio escrito com imports planos (`from models import Finding`),
# assumindo que o diretório do pipeline está no sys.path. Em vez de reescrever
# os imports, declaramos a raiz aqui — assim `pytest` funciona da raiz do repo
# e o código continua idêntico ao que foi escrito.
#
# Se o time decidir depois transformar analyzer/ em package de verdade
# (`from analyzer.models import ...`), é só remover o pythonpath daqui.
[pytest]
pythonpath = analyzer
testpaths = analyzer/tests
